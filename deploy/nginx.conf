# ============================================
# 滑坡监测系统 Nginx 配置
# ============================================
# 用法：
#   1. 将此文件复制到服务器 /etc/nginx/conf.d/landslide.conf
#   2. 修改 server_name 为你的域名
#   3. 修改 root 为你的实际部署路径
#   4. 执行 nginx -t && nginx -s reload
# ============================================

server {
    listen 80;
    server_name your-domain.com;  # ← 改成你的域名或 IP

    # 网站根目录（dist/ 内容解压到此处）
    root /var/www/landslide-monitor;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 点云 .pnts 文件 MIME 类型
    types {
        application/octet-stream pnts;
        application/json json;
    }

    # 静态资源缓存策略
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cesium 静态资源缓存
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 点云数据 - 允许跨域（如果需要从 CDN 加载）
    location ~* \.(pnts|json|b3dm|i3dm|cmpt|glb|gltf)$ {
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    # Gzip 压缩（加速传输）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/octet-stream
        image/svg+xml;

    # 上传大小限制（点云文件可能较大）
    client_max_body_size 100M;

    # 错误页面
    error_page 404 /index.html;
}

